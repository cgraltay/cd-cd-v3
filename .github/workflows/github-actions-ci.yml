name: github-actions-ci

on:
  pull_request:
    paths:
      - "github-actions/**"
      - ".github/workflows/github-actions-ci.yml"
      - ".github/workflows/salesforce-pr-review.yml"
      - ".github/workflows/check-org-connections.yml"
      - ".github/workflows/release-execution.yml"
      - ".github/workflows/validate-deploy-*.yml"
      - ".github/workflows/quick-deploy-release.yml"
      - ".github/workflows/reconcile-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-actions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: github-actions/.nvmrc
          cache: npm
          cache-dependency-path: github-actions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check action tooling
        run: npm run check
      - name: Verify committed bundles
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- actions)" ]]; then
            printf '%s\n' 'Run npm run build and commit the generated action bundles.'
            exit 1
          fi

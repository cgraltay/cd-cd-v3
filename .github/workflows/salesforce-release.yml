name: Salesforce Manual Release
run-name: Salesforce ${{ inputs.operation }} | ${{ inputs.source-branch }} | ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      source-branch:
        description: Source branch, for example release-x (independent of workflow code branch)
        required: true
        type: string
        default: main
      environment:
        description: Target Salesforce GitHub environment
        required: true
        type: environment
      operation:
        description: Validate only, deploy, quick deploy a saved validation, or reconcile a pipeline job
        required: true
        type: choice
        default: validate
        options:
          - validate
          - deploy
          - quick-deploy
          - reconcile
      mode:
        description: Payload mode (Quick Deploy and reconciliation use their saved payload)
        required: true
        type: choice
        default: configured
        options:
          - configured
          - full
          - delta
      to-sha:
        description: Optional full source commit SHA; otherwise pin the source branch tip
        required: false
        type: string
      release-record-id:
        description: GitHub release record ID for Quick Deploy or reconciliation (not Salesforce job ID)
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    name: Pin Source Branch and Select Org
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      config: ${{ steps.plan.outputs.config }}
      orgs-config: ${{ steps.plan.outputs.orgs-config }}
      profile: ${{ steps.plan.outputs.profile }}
      head-sha: ${{ steps.plan.outputs.head-sha }}
      branch-sha: ${{ steps.plan.outputs.branch-sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .ci
          persist-credentials: false
      - name: Resolve source branch, environment, and immutable configuration
        id: plan
        uses: ./.ci/github-actions/actions/deploy-metadata
        with:
          config: ${{ vars.SF_CICD_CONFIG }}
          orgs-config: ${{ vars.SF_ORGS_CONFIG }}
          source-branch: ${{ inputs.source-branch }}
          environment: ${{ inputs.environment }}
          operation: ${{ inputs.operation }}
          mode: ${{ inputs.mode }}
          to-sha: ${{ inputs.to-sha }}
          release-record-id: ${{ inputs.release-record-id }}
          prepare-only: "true"

  release:
    name: Salesforce ${{ inputs.operation }} (${{ inputs.environment }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      deployments: write
    environment: ${{ inputs.environment }}
    concurrency:
      group: salesforce-release-${{ github.repository }}-${{ fromJSON(needs.prepare.outputs.profile).org }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .ci
          persist-credentials: false
      - name: Checkout pinned source metadata
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.head-sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Execute tracked Salesforce operation
        id: release
        uses: ./.ci/github-actions/actions/deploy-metadata
        with:
          config: ${{ needs.prepare.outputs.config }}
          orgs-config: ${{ needs.prepare.outputs.orgs-config }}
          source-branch: ${{ inputs.source-branch }}
          environment: ${{ inputs.environment }}
          operation: ${{ inputs.operation }}
          mode: ${{ inputs.mode }}
          release-record-id: ${{ inputs.release-record-id }}
          head-sha: ${{ needs.prepare.outputs.head-sha }}
          branch-sha: ${{ needs.prepare.outputs.branch-sha }}
          working-directory: source
          username: ${{ secrets[fromJSON(needs.prepare.outputs.profile).usernameSecret] }}
          client-id: ${{ secrets[fromJSON(needs.prepare.outputs.profile).clientIdSecret] }}
          jwt-private-key: ${{ secrets[fromJSON(needs.prepare.outputs.profile).jwtKeySecret] }}
      - name: Upload sanitized Salesforce report
        if: ${{ always() && steps.release.outputs.report-path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact-name }}
          path: ${{ steps.release.outputs.report-path }}
          if-no-files-found: ignore
          retention-days: 10

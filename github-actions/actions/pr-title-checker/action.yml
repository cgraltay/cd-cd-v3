name: PR Title Checker
description: Validate PR titles with target-specific regex rules and keep failure comments in sync.
branding:
  icon: type
  color: green
inputs:
  config:
    description: JSON branch configuration, typically vars.SF_CICD_CONFIG.
    required: true
  github-token:
    description: GitHub token with pull-requests write permission to create, update, and delete feedback.
    default: ${{ github.token }}
  title:
    description: PR title; defaults to the title from the GitHub event.
    default: ${{ github.event.pull_request.title }}
  target-branch:
    description: The PR target branch used to select title rules.
    default: ${{ github.base_ref }}
outputs:
  checked:
    description: Whether an enabled title policy was evaluated, as true or false.
  valid:
    description: Whether the title was accepted or the policy was disabled, as true or false.
  title:
    description: The evaluated PR title, without whitespace normalization.
  target-branch:
    description: The evaluated PR target branch.
  matched-branch:
    description: The selected exact target rule or glob pattern.
  matched-pattern:
    description: The accepted title regular expression, or an empty string.
runs:
  using: node24
  main: dist/index.js

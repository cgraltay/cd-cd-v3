name: Release Engine
description: Shared explicit-source release runner; use the focused validate/deploy actions for manual workflows.
branding:
  icon: upload-cloud
  color: green
inputs:
  config:
    description: Branch policy JSON snapshot from SF_CICD_CONFIG.
    required: true
  orgs-config:
    description: Credential-free org profile JSON snapshot from SF_ORGS_CONFIG.
    required: true
  source-branch:
    description: Source branch for credential-free preparation; utilities derive it from their saved reference.
  environment:
    description: Selected GitHub environment, mapped to exactly one allowed org.
    required: true
  operation:
    description: validate, deploy, quick-deploy, or reconcile a previously recorded pipeline job.
    default: validate
  selection:
    description: full-branch, commit-range, or branch-changes for preparation.
  start-commit:
    description: Inclusive first full commit SHA for Commit Range.
  end-commit:
    description: Inclusive last full commit SHA for Commit Range.
  comparison-branch:
    description: Comparison branch for Branch Changes.
  plan:
    description: Immutable prepared operation/source plan for execution.
  release-record-id:
    description: Prefixed saved reference such as validation:123 or deployment:456.
  prepare-only:
    description: Resolve policy and pin the source commit without Salesforce credentials.
    default: 'false'
  github-token:
    description: Token with contents read, checks write, and deployments write for execution.
    default: ${{ github.token }}
  working-directory:
    description: Clean source checkout containing sfdx-project.json, relative to GITHUB_WORKSPACE.
    default: .
  username:
    description: Integration username from the selected environment secret.
  client-id:
    description: OAuth app client ID from the selected environment secret.
  jwt-private-key:
    description: Full unencrypted RSA PEM private key from the selected environment secret.
outputs:
  plan:
    description: Pinned credential-free operation/source plan.
  config:
    description: Branch policy snapshot for execution.
  orgs-config:
    description: Org profile snapshot for execution.
  profile:
    description: Selected org profile and secret names, without credential values.
  head-sha:
    description: Pinned source commit.
  branch-sha:
    description: Pinned source branch tip.
  outcome:
    description: Succeeded, Failed, or Skipped; history is audit-only.
  release-record-id:
    description: Saved validation or deployment reference for Quick Deploy or reconciliation.
  deployment-id:
    description: Salesforce validation or actual deployment job ID.
  report-path:
    description: Sanitized Salesforce report path, when available.
  artifact-name:
    description: Stable safe report artifact name for this org.
runs:
  using: node24
  main: dist/index.js

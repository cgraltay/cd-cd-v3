name: Reconcile Deployment
description: Report a saved Salesforce job and update its audit result without submitting metadata.
inputs:
  config:
    description: Prepared branch policy snapshot.
    required: true
  orgs-config:
    description: Prepared org profile snapshot.
    required: true
  environment:
    description: Selected GitHub environment.
    required: true
  plan:
    description: Prepared plan derived from a saved validation or deployment reference.
    required: true
  working-directory:
    description: Pinned source checkout relative to the workspace.
    default: .
  username:
    description: Integration username secret.
  client-id:
    description: OAuth client ID secret.
  jwt-private-key:
    description: Full multiline RSA PEM secret.
  github-token:
    description: Token for saved job lookup and audit updates.
    default: ${{ github.token }}
outputs:
  outcome:
    description: Succeeded or Failed.
  release-record-id:
    description: Reconciled saved reference.
  deployment-id:
    description: Existing Salesforce job ID; no new job is submitted.
  report-path:
    description: Sanitized JSON report path.
  artifact-name:
    description: Safe artifact name.
runs:
  using: node24
  main: dist/index.js
